name: test

on:
  push:
    branches: [main, "dev/**"]   # other branches: through a PR
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests (CONVINO_SLOW_TESTS=1)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest   # arm64; one version is enough (10x minutes)
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      CONVINO_SLOW_TESTS: ${{ inputs.slow && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Test the built wheel, not the checkout, so packaging errors show up.
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install "$(ls dist/*.whl)[test]"
      - run: python -m pytest test -q
