name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macos-latest = arm64
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test the built wheel, not the checkout, so packaging errors show up.
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pytest test -q
