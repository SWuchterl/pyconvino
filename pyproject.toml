[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyconvino"
version = "0.1.0"
description = "Convino physics combination tool — Python/JAX port (no ROOT, no Minuit)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastian Wuchterl", email = "sebastian.wuchterl@cern.ch" }]
keywords = ["physics", "statistics", "combination", "HEP", "Convino", "JAX", "chi2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# jax pulls in the matching jaxlib itself. Lower bounds = oldest versions
# tested (jax 0.10 on Python 3.11 in CI).
dependencies = [
    "jax>=0.10",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/SWuchterl/pyconvino"
Issues = "https://github.com/SWuchterl/pyconvino/issues"
"Original Convino" = "https://github.com/jkiesele/Convino"

[project.scripts]
pyconvino = "pyconvino.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Errors and unused names (E4, E7, E9, F), import order (I), modern syntax
# (UP), bugbear (B), simplify (SIM). Listed in full: the default set of newer
# ruff versions is larger. E741 (`l` as a name), E702 (`a; b`): style only.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["E741", "E702"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
